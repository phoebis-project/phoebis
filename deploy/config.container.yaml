# The container: every listener binds all interfaces and the host publishes the ports it wants (deploy/compose.yaml
# publishes the proxy to the LAN and the console and metrics on the host's loopback). The admin secret comes from the
# environment file and the key from the mounted secret; the databases live on the volume at /var/lib/phoebis.
admin:
  # tls: plain_http serves the console over plain HTTP on whatever address the host publishes 8081 on. On the loopback
  # publication of the compose example that costs nothing; on a LAN publication the admin secret at login and the
  # session cookie on every call cross that LAN in the clear.
  listen: 0.0.0.0:8081
  tls: plain_http
  secret_env: PHOEBIS_ADMIN_SECRET
keepalive:
  # Process-wide limits only. Whether a pool's sessions are probed, and the probe tuning, are pool settings in
  # the registry.
  max_agents: 1024
  max_retained_bytes: 268435456
  max_sessions: 128
proxy:
  listen: 0.0.0.0:8317
  # The container network is plain HTTP by default; the host decides what it publishes.
  tls: plain_http
  # The bounds on the request bodies the proxy holds, at their defaults; uncomment a key to change it.
  # body_budget_bytes: 536870912
  # body_read_seconds: 60
  # key_body_reads: 128
  # max_request_bytes: 33554432
  # Signs a restored cch=00000 with this build's formula; off until a server rejects the placeholder.
  # sign_cch_placeholder: false
  # How the edited body leaves: auto mirrors the client, on always gzip, off always identity.
  # upstream_gzip: auto
routing:
  cooldown_fallback_seconds: 60
sessions:
  expire_after_seconds: 86400
  # The relay's memory of a session's previous request id and prompt id: entries held in process, how long one
  # may go unseen before it leaves memory, and how long its on-disk copy is kept.
  memory_cap: 65536
  memory_idle_seconds: 86400
  memory_retention_days: 30
stats:
  # The longest a key or pool may keep captured bodies, 1 to 168.
  body_capture_max_hours: 72
  ledger_path: /var/lib/phoebis/ledger.sqlite
  # Prometheus text format at /metrics; the compose example publishes it on the host's loopback.
  metrics_listen: 0.0.0.0:9464
  # Overrides the shipped price table; a missing file is fine, and the volume is where one would be dropped.
  pricing_path: /var/lib/phoebis/pricing.yaml
  # Raw requests, attempts, events, and the quota and extra-usage samples are purged past this; 0 keeps them forever.
  retention_days: 90
  # Hourly rollups are purged past this; 0 keeps them forever, otherwise at least retention_days.
  rollup_retention_days: 400
storage:
  encryption_key_file: /run/secrets/router-storage-key
  path: /var/lib/phoebis/router.sqlite
usage:
  cache_ttl_seconds: 60
  refresh_concurrency: 2
