# The router from the registry image under bridge networking: the proxy port is published on every interface, the
# console and the metrics port on the host's loopback only, so the console's cookie stays off the LAN. Publishing
# 8081 on a LAN address is one edit to the ports line. The installation page says what that costs. A listener you
# publish beyond the host serves plain HTTP unless its `tls` names a certificate pair.
secrets:
  router-storage-key:
    # Compose bind-mounts a file secret with the host file's owner and mode: own it by uid 65532, mode 0400.
    file: ./storage.key
services:
  phoebis:
    env_file: phoebis.env
    image: ghcr.io/phoebis-project/phoebis:0.1.0
    ports:
      - "8317:8317"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:9464:9464"
      # The feature listener on port 443 of the host for a DNS redirect, with features.listen on 0.0.0.0:8443.
      # - "443:8443"
    restart: unless-stopped
    secrets:
      - router-storage-key
    # The router's shutdown budget is 35 seconds after SIGTERM, and the grace period leaves five more.
    stop_grace_period: 40s
    volumes:
      - ./config.yaml:/etc/phoebis/config.yaml:ro
      - phoebis-data:/var/lib/phoebis
      # A certificate pair you hold, mounted read-only and named under tls in config.yaml.
      # - ./tls:/etc/phoebis/tls:ro
  # phoebis-proxy, the tunnel a client of the claude.ai features sets as its HTTPS_PROXY. It reaches the feature
  # listener by the router's service name, so config.yaml holds features.listen on 0.0.0.0:8443 and the proxy needs
  # no port of the router published. It tunnels each host for whoever reaches its own port, so the allow list names
  # the network its clients' connections arrive from.
  # The stack example with both services is at https://github.com/phoebis-project/phoebis-proxy
  # phoebis-proxy:
  #   environment:
  #     PHOEBIS_PROXY_ALLOW: 192.0.2.0/24
  #     PHOEBIS_PROXY_UPSTREAM: phoebis:8443
  #   image: ghcr.io/phoebis-project/phoebis-proxy:0.1.0
  #   ports:
  #     - "8318:8318"
  #   restart: unless-stopped
volumes:
  phoebis-data:
