name: Tests
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Actions does not evaluate `secrets` in a step's `if`, so the companion steps test this copy instead.
      COMPANION_READ_TOKEN: ${{ secrets.COMPANION_READ_TOKEN }}
      # The console is built once below and embedded as it is, as the image's builder does.
      PHOEBIS_SKIP_UI_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # clang, cmake, libclang-dev and pkg-config build BoringSSL and its bindings.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake libclang-dev pkg-config
      # rustup reads rust-toolchain.toml: the pinned version with clippy and rustfmt.
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      # The registry and target/ with BoringSSL's compiled output, keyed on Cargo.lock and the toolchain: the step
      # that costs the most on a cold runner.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          PHOEBIS_UI_EXPECT: bundle
      # The companion registration test is opt-in in code; the checkout below is what opts in, and only while the
      # companion repository is private behind a read token.
      - if: env.COMPANION_READ_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: daystrom-labs/phoebis-keepalive
          path: companion
          token: ${{ env.COMPANION_READ_TOKEN }}
          persist-credentials: false
      - if: env.COMPANION_READ_TOKEN != ''
        run: cargo test -p phoebis-router --test end_to_end the_companion_registers --locked
        env:
          PHOEBIS_COMPANION_DIR: ${{ github.workspace }}/companion
      - if: env.COMPANION_READ_TOKEN == ''
        run: echo "::notice::the companion registration test was skipped because COMPANION_READ_TOKEN is unset"
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      # The mock pass is CI's browser check; the live pass needs a router with a secret and stays local.
      - run: npm run e2e:mock
        env:
          PHOEBIS_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
  tests:
    name: Tests
    needs: [rust, web]
    # Branch protection requires a job's check, not a workflow's: this job is the one check `main` requires, and
    # it reports whatever the two jobs did, a cancelled or skipped one included.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.rust.result }}" = success && test "${{ needs.web.result }}" = success
