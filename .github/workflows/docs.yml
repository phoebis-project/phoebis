name: Documentation
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - run: scripts/tests/check-docs.sh
      - run: scripts/tests/launch-script.sh
      # Pinned to the version the site is written and checked against. A newer Zensical may warn on
      # syntax this one accepts, and a warning fails the build below.
      - run: pip install zensical==0.0.62
      - run: zensical build --clean --strict
      - run: python3 scripts/check-docs.py links
      - run: python3 scripts/check-docs.py client
      - run: python3 scripts/check-docs.py check-config
      - run: python3 scripts/check-docs.py codes
      - run: python3 scripts/check-docs.py example
      - run: python3 scripts/check-docs.py unit
      - run: python3 scripts/check-docs.py schema
      - run: python3 scripts/check-docs.py prose
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    # Pages is the operator's switch: the job waits for a repository variable set after Pages is enabled,
    # so a push to main stays green until then. configure-pages lives here rather than in build because it
    # fails on a repository where Pages is not enabled.
    if: github.event_name == 'push' && vars.DOCS_PAGES == '1'
    needs: build
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
