name: Release
on:
  # No push starts this workflow: the image build prints the event that started the run, and a push event holds the
  # pusher's account address.
  # A pull request that touches the image's or the static binary's inputs builds amd64 without pushing, so a broken
  # Dockerfile or cross build is caught before a release runs it. The list holds what Tests does not build. A member's
  # manifest stays in it, since a feature change can pull in C code with no change to Cargo.lock, and a workspace
  # member outside crates/ adds its own line.
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/release.yml
      - Cargo.lock
      - Cargo.toml
      - Cross.toml
      - Dockerfile
      - crates/*/Cargo.toml
      - deploy/config.container.yaml
      - rust-toolchain.toml
      - tests/fake_upstream/Cargo.toml
      - web/.nvmrc
      - web/package-lock.json
      - web/package.json
  release:
    types: [published]
  # The dry run: every platform is built and smoked, nothing is pushed.
  workflow_dispatch:
# Read-only by default; each job that reaches the registry names the scope it needs.
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      exporter: ${{ steps.decide.outputs.exporter }}
      image: ${{ steps.decide.outputs.image }}
      matrix: ${{ steps.decide.outputs.matrix }}
      push: ${{ steps.decide.outputs.push }}
      registry_image: ${{ steps.decide.outputs.registry_image }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\([^"]*\)"$/\1/p}' Cargo.toml)
          if ! { [ -n "$version" ] && [ "$(printf '%s\n' "$version" | wc -l)" = 1 ]; }; then
            echo "Cargo.toml has no single workspace version"
            exit 1
          fi
          amd64='{"platform":"linux/amd64","runner":"ubuntu-24.04","slug":"linux-amd64",'
          amd64+='"target":"x86_64-unknown-linux-musl"}'
          arm64='{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","slug":"linux-arm64",'
          arm64+='"target":"aarch64-unknown-linux-musl"}'
          # ghcr.io accepts lower-case names only; GITHUB_REPOSITORY keeps the owner's spelling.
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "registry_image=$registry_image" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = release ]; then
            printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
              || { echo "release tag '$TAG' is not X.Y.Z or X.Y.Z-suffix"; exit 1; }
            [ "$TAG" = "$version" ] \
              || { echo "release tag '$TAG' differs from the workspace version '$version' in Cargo.toml"; exit 1; }
            grep -Eq "^## ${TAG//./\\.}( |\$)" docs/site/changelog.md \
              || { echo "docs/site/changelog.md has no '## $TAG' section for this release"; exit 1; }
            {
              echo "exporter=type=image,push-by-digest=true,name-canonical=true,push=true"
              echo "image=$registry_image"
              echo "matrix=[$amd64,$arm64]"
              echo "push=true"
            } >> "$GITHUB_OUTPUT"
          else
            if [ "$EVENT" = pull_request ]; then
              matrix="[$amd64]"
            else
              matrix="[$amd64,$arm64]"
            fi
            {
              echo "exporter=type=docker,dest=/tmp/phoebis.tar"
              echo "image=phoebis:smoke"
              echo "matrix=$matrix"
              echo "push=false"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.guard.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # A release pushes each platform's image by digest from here. A job's permissions cannot follow the event, so a
    # pull request's build holds the scope on a path that never pushes.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: needs.guard.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.guard.outputs.registry_image }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: PHOEBIS_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,scope=${{ matrix.slug }},mode=max
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ needs.guard.outputs.exporter }}
          platforms: ${{ matrix.platform }}
          # The docker exporter takes no attestation manifests, so the dry run and the pull request build none.
          provenance: ${{ needs.guard.outputs.push == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.guard.outputs.push == 'true' }}
          tags: ${{ needs.guard.outputs.image }}
      - if: needs.guard.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: needs.guard.outputs.push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
      - if: needs.guard.outputs.push != 'true' && matrix.slug == 'linux-amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: image-linux-amd64
          path: /tmp/phoebis.tar
          retention-days: 1
  binary:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.guard.outputs.matrix) }}
    # Both triples build on the amd64 runner: cross's target images are amd64, and cross compiling the arm64 asset
    # there is what the tool is for; the smoke below runs each asset on its own platform.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BORING_BSSL_RUST_CPPLIB: stdc++
      PHOEBIS_BUILD_COMMIT: ${{ github.sha }}
      PHOEBIS_SKIP_UI_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - run: cd web && node scripts/check-build.mjs
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - run: cargo install cross --locked --version 0.2.5
      - run: cross build --release --locked --target ${{ matrix.target }} --package phoebis-router
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: binary-${{ matrix.slug }}
          path: target/${{ matrix.target }}/release/phoebis
          retention-days: 1
  binary-smoke:
    needs: [guard, binary]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.guard.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.slug }}
      - run: |
          chmod 0755 phoebis
          printed=$(./phoebis --version)
          [ "$printed" = "phoebis $VERSION" ] \
            || { echo "--version printed '$printed', not 'phoebis $VERSION'"; exit 1; }
          linked=$(file ./phoebis)
          case "$linked" in
            *'statically linked'*|*'static-pie linked'*) ;;
            *) echo "the binary is not static: $linked"; exit 1;;
          esac
          if ldd ./phoebis 2>&1 | grep -qv 'not a dynamic executable\|statically linked'; then
            echo "ldd found a dynamic dependency"; ldd ./phoebis; exit 1
          fi
          # The built bundle's page references /assets/index-<hash>.js, which the placeholder page never carries.
          grep -q '/assets/index-' ./phoebis || { echo "the binary embeds no built console bundle"; exit 1; }
          tmp=$(mktemp -d)
          ./phoebis init --non-interactive --config "$tmp/config.yaml" > "$tmp/secret.env"
          ./phoebis check-config --config "$tmp/config.yaml"
          asset="phoebis-$VERSION-$TARGET"
          mkdir "$asset" && cp phoebis LICENSE "$asset/"
          tar -czf "$asset.tar.gz" "$asset"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: asset-${{ matrix.slug }}
          path: phoebis-*.tar.gz
          retention-days: 1
  smoke:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    # A release smokes the digest the build pushed, pulled from the registry.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.guard.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - if: needs.guard.outputs.push == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-linux-amd64
          path: ${{ runner.temp }}/digests
      - if: needs.guard.outputs.push != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-linux-amd64
          path: ${{ runner.temp }}
      - id: image
        env:
          IMAGE: ${{ needs.guard.outputs.registry_image }}
          PUSH: ${{ needs.guard.outputs.push }}
        run: |
          if [ "$PUSH" = true ]; then
            ref="$IMAGE@sha256:$(ls "$RUNNER_TEMP/digests")"
            docker pull "$ref"
          else
            docker load -i "$RUNNER_TEMP/phoebis.tar"
            ref=phoebis:smoke
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - env:
          REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          printed=$(docker run --rm "$REF" --version)
          [ "$printed" = "phoebis $VERSION" ] \
            || { echo "--version printed '$printed', not 'phoebis $VERSION'"; exit 1; }
          tmp=$(mktemp -d)
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$tmp/storage.key"
          chmod 0444 "$tmp/storage.key"
          # check-config and the router refuse a secret shorter than 16 characters.
          printf 'PHOEBIS_ADMIN_SECRET=smoke-admin-secret-0000\n' > "$tmp/phoebis.env"
          printf 'RUST_LOG=info\n' >> "$tmp/phoebis.env"
          docker run --rm --env-file "$tmp/phoebis.env" \
            -v "$PWD/deploy/config.container.yaml:/etc/phoebis/config.yaml:ro" \
            -v "$tmp/storage.key:/run/secrets/router-storage-key:ro" "$REF" check-config
          docker volume create phoebis-smoke-data
          docker run -d --name phoebis-smoke --env-file "$tmp/phoebis.env" -p 127.0.0.1:18081:8081 \
            -v "$PWD/deploy/config.container.yaml:/etc/phoebis/config.yaml:ro" \
            -v "$tmp/storage.key:/run/secrets/router-storage-key:ro" \
            -v phoebis-smoke-data:/var/lib/phoebis "$REF"
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' phoebis-smoke)
            [ "$status" = healthy ] && break
            sleep 1
          done
          [ "$status" = healthy ] \
            || { docker logs phoebis-smoke; echo "the container is '$status' after 30 s"; exit 1; }
          docker logs phoebis-smoke > "$tmp/start.log" 2>&1
          ! grep -q '/var/lib/phoebis is ' "$tmp/start.log" \
            || { cat "$tmp/start.log"; echo "the data directory draws the store's warning"; exit 1; }
          # The console's shell is served without a session: the page must be the built bundle, not the
          # placeholder the crate's build script embeds when npm fails, and one of its assets must be served.
          shell=$(curl -fsS http://127.0.0.1:18081/)
          case "$shell" in
            *'<!-- phoebis-ui placeholder -->'*) echo "the image serves the placeholder console page"; exit 1;;
          esac
          asset=$(printf '%s' "$shell" | grep -o '/assets/[^"'"'"' ]*' | head -1)
          [ -n "$asset" ] || { echo "the console page references no /assets/ path"; exit 1; }
          curl -fsSo /dev/null "http://127.0.0.1:18081$asset" || { echo "console asset $asset was not served"; exit 1; }
          # The API reference page and its document are served without a session: the page must be the built
          # bundle's, and the document must hold more than 50 paths.
          reference=$(curl -fsS http://127.0.0.1:18081/api-reference/)
          case "$reference" in
            *'<div id="app">'*) ;;
            *) echo "the image serves no API reference page"; exit 1;;
          esac
          curl -fsS http://127.0.0.1:18081/api-reference/openapi.json > "$tmp/openapi.json"
          [ "$(jq -r .openapi "$tmp/openapi.json")" = 3.1.0 ] \
            || { echo "the document is not OpenAPI 3.1.0"; exit 1; }
          [ "$(jq '.paths | length' "$tmp/openapi.json")" -gt 50 ] \
            || { echo "the document holds 50 paths or fewer"; exit 1; }
          # The container's environment carries the secret, so this smokes the bearer
          # path, the five reads and the screen.
          docker exec phoebis-smoke phoebis status > "$tmp/status.txt" \
            || { cat "$tmp/status.txt"; echo "status exited non-zero"; exit 1; }
          head -n 1 "$tmp/status.txt" | grep -q ', ready$' \
            || { cat "$tmp/status.txt"; echo "status's first line does not end in ready"; exit 1; }
          # The two copies and the manifest land on the volume; backup creates the missing parent.
          docker exec phoebis-smoke phoebis backup --to /var/lib/phoebis/backups/smoke
          # A second, short container with a certificate pair on the admin listener, generated here: the image must
          # terminate TLS with an operator's pair and serve the console shell to a client that trusts that certificate.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,IP:127.0.0.1 -keyout "$tmp/admin.key" -out "$tmp/admin.pem" 2>/dev/null
          chmod 0444 "$tmp/admin.pem" "$tmp/admin.key"   # uid 65532 reads both; the start warns about the key's mode
          awk '{print} /^  listen: 0.0.0.0:8081$/ && !done {print "  tls:"; \
            print "    cert_file: /etc/phoebis/admin.pem"; print "    key_file: /etc/phoebis/admin.key"; done=1}' \
            deploy/config.container.yaml > "$tmp/config.tls.yaml"
          docker volume create phoebis-smoke-tls
          docker run -d --name phoebis-smoke-tls --env-file "$tmp/phoebis.env" -p 127.0.0.1:18082:8081 \
            -v "$tmp/config.tls.yaml:/etc/phoebis/config.yaml:ro" \
            -v "$tmp/admin.pem:/etc/phoebis/admin.pem:ro" -v "$tmp/admin.key:/etc/phoebis/admin.key:ro" \
            -v "$tmp/storage.key:/run/secrets/router-storage-key:ro" \
            -v phoebis-smoke-tls:/var/lib/phoebis "$REF"
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' phoebis-smoke-tls)
            [ "$status" = healthy ] && break
            sleep 1
          done
          [ "$status" = healthy ] \
            || { docker logs phoebis-smoke-tls; echo "the TLS container is '$status' after 30 s"; exit 1; }
          tls_shell=$(curl --cacert "$tmp/admin.pem" -fsS https://127.0.0.1:18082/)
          case "$tls_shell" in
            *'<!-- phoebis-ui placeholder -->'*|'') echo "the TLS listener did not serve the console shell"; exit 1;;
          esac
          docker stop -t 40 phoebis-smoke-tls && docker rm phoebis-smoke-tls && docker volume rm phoebis-smoke-tls
          started=$(date +%s)
          docker stop -t 40 phoebis-smoke
          stopped=$(( $(date +%s) - started ))
          docker logs phoebis-smoke
          [ "$stopped" -lt 40 ] || { echo "docker stop took ${stopped}s, past the grace period"; exit 1; }
          echo "healthy, and stopped in ${stopped}s"
  publish:
    if: needs.guard.outputs.push == 'true'
    needs: [guard, smoke, binary-smoke]
    runs-on: ubuntu-24.04
    # The one job that writes the repository's contents: it uploads the release's archives.
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.guard.outputs.registry_image }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/digests
          pattern: digest-*
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/assets
          pattern: asset-*
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # The major-only tag would name 0.x releases that break each other; latest never names a prerelease.
          flavor: latest=false
          images: ${{ needs.guard.outputs.registry_image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},enable=${{ !startsWith(env.VERSION, '0.') }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}
            type=sha,prefix=sha-
      - env:
          TAGS: ${{ steps.meta.outputs.tags }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
      - run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | unique
                     | contains(["amd64", "arm64"])'
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ runner.temp }}/assets
        run: |
          sha256sum phoebis-*.tar.gz > SHA256SUMS
          gh release upload "$VERSION" phoebis-*.tar.gz SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
