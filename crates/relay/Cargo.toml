[package]
name = "phoebis-relay"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# The count of the decoders the relay builds for its own reads of a response, see `Relay::decoders_built`. The
# relay's own dev-dependency below turns it on for a test build, so a release build carries no counter.
debug-hooks = []

[dependencies]
axum = { workspace = true }
boring = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
hmac = { workspace = true }
http-body-util = { workspace = true }
httparse = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
jiff = { workspace = true }
phoebis-bus = { path = "../bus" }
phoebis-cch = { path = "../cch" }
phoebis-guardrails = { path = "../guardrails" }
phoebis-oauth = { path = "../oauth" }
phoebis-profile = { path = "../profile" }
phoebis-routing = { path = "../routing" }
phoebis-store = { path = "../store" }
phoebis-transport = { path = "../transport" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-boring = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

# The bound on a socket's unacknowledged bytes is the Linux kernel's `TCP_USER_TIMEOUT`, so no other build sets it.
[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { workspace = true }

[dev-dependencies]
fake-upstream = { path = "../../tests/fake_upstream" }
flate2 = { workspace = true }
phoebis-bus = { path = "../bus" }
phoebis-ledger = { path = "../ledger" }
# An integration test builds the library without `cfg(test)`, so the counter it reads needs the feature on.
phoebis-relay = { path = ".", features = ["debug-hooks"] }
# The router task's report hold, which the conversation climb's wait tests park a report behind.
phoebis-routing = { path = "../routing", features = ["debug-hooks"] }
phoebis-store = { path = "../store", features = ["debug-hooks", "test-support"] }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
xxhash-rust = { workspace = true }
