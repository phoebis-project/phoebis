[package]
name = "phoebis-oauth"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true }
phoebis-profile = { path = "../profile" }
phoebis-store = { path = "../store" }
phoebis-transport = { path = "../transport" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[features]
# The refresh test seam. Enabled through the self dev-dependency below, so it is on for this crate's own
# tests and absent from anything else that depends on it.
debug-hooks = []
# The seed of `random`'s source, turned on by a dependent's dev-dependency for a capture that must repeat, so a
# release build mints from the process CSPRNG alone.
test-support = []

[dev-dependencies]
fake-upstream = { path = "../../tests/fake_upstream" }
phoebis-oauth = { path = ".", features = ["debug-hooks"] }
phoebis-store = { path = "../store", features = ["debug-hooks"] }
tokio = { workspace = true, features = ["test-util"] }
