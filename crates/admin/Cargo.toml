[package]
name = "phoebis-admin"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
phoebis-attention = { path = "../attention" }
phoebis-bus = { path = "../bus" }
phoebis-guardrails = { path = "../guardrails" }
phoebis-ledger = { path = "../ledger" }
phoebis-oauth = { path = "../oauth" }
phoebis-profile = { path = "../profile" }
phoebis-relay = { path = "../relay" }
phoebis-routing = { path = "../routing" }
phoebis-session-engine = { path = "../session-engine" }
phoebis-store = { path = "../store" }
phoebis-transport = { path = "../transport" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[dev-dependencies]
fake-upstream = { path = "../../tests/fake_upstream" }
http-body-util = { workspace = true }
jsonschema = { workspace = true }
# The test tables and the read count the dry run's pages are pinned by, kept off the dependency above so a release
# build carries none.
phoebis-ledger = { path = "../ledger", features = ["debug-hooks", "test-support"] }
# The seed the fixture capture mints its ids and secrets from and the re-export of the limit resets parser a test
# stores its block with, kept off the dependency above so a release build carries neither.
phoebis-oauth = { path = "../oauth", features = ["test-support"] }
# The embedded fixture files, which only tests read, kept off the dependency above so a release build compiles none.
phoebis-profile = { path = "../profile", features = ["test-support"] }
phoebis-store = { path = "../store", features = ["debug-hooks", "test-support"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
