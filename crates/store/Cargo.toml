[package]
name = "phoebis-store"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# The startup-recovery test seam, see `debug_corrupt_credentials`. A dependent's dev-dependency, and this
# crate's own below, turn it on for a test build, so a release build carries no way to damage a stored
# credential.
debug-hooks = []

[dependencies]
aes-gcm = { workspace = true }
fd-lock = { workspace = true }
hmac = { workspace = true }
jiff = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# An integration test builds the library without `cfg(test)`, so the seams it reaches need the feature on.
phoebis-store = { path = ".", features = ["debug-hooks"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }
