[package]
name = "phoebis-store"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# The startup-recovery test seam, see `debug_corrupt_credentials`. A dependent's dev-dependency, and this
# crate's own below, turn it on for a test build, so a release build carries no way to damage a stored
# credential.
debug-hooks = []
# The test builders of the registry's rows, so a release build carries none of them.
test-support = []

[dependencies]
aes-gcm = { workspace = true }
base64 = { workspace = true }
fd-lock = { workspace = true }
hmac = { workspace = true }
jiff = { workspace = true }
libc = { workspace = true }
phoebis-guardrails = { path = "../guardrails" }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# The migration test reads a stored cache TTL policy the way the relay does, so the two crates' readings of the
# same JSON cannot drift apart unnoticed.
phoebis-relay = { path = "../relay" }
# A lane is built with the routing crate's one constructor, the spelling every pin and entry compares.
phoebis-routing = { path = "../routing" }
# An integration test builds the library without `cfg(test)`, so the seams and builders it reaches need the
# features on.
phoebis-store = { path = ".", features = ["debug-hooks", "test-support"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }
