[package]
name = "phoebis-attention"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
phoebis-bus = { path = "../bus" }
phoebis-ledger = { path = "../ledger" }
phoebis-oauth = { path = "../oauth" }
phoebis-routing = { path = "../routing" }
phoebis-store = { path = "../store" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
# The scrape tests drive the metrics listener's router in process.
axum = { workspace = true }
bytes = { workspace = true }
fake-upstream = { path = "../../tests/fake_upstream" }
http-body-util = { workspace = true }
# A reader test stores a limit reset block from a usage body through the parser's re-export, which needs the feature.
phoebis-oauth = { path = "../oauth", features = ["test-support"] }
# A backoff test polls a real usage service over the fake upstream, which needs a profile and a control client.
phoebis-profile = { path = "../profile" }
# An integration test drives the store's injected-failure seam and builds its pool with the store's test builder,
# which need the features on.
phoebis-store = { path = "../store", features = ["debug-hooks", "test-support"] }
# The backoff test's control client.
phoebis-transport = { path = "../transport" }
tower = { workspace = true }
