[package]
name = "phoebis-keepalive"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# The step scheduler's router-ask counter, see `Engine::router_views`. A dependent's dev-dependency, and this
# crate's own below, turn it on for a test build, so a release build carries no counter reader.
debug-hooks = []

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
jiff = { workspace = true }
phoebis-bus = { path = "../bus" }
phoebis-cch = { path = "../cch" }
phoebis-ledger = { path = "../ledger" }
phoebis-oauth = { path = "../oauth" }
phoebis-relay = { path = "../relay" }
phoebis-routing = { path = "../routing" }
phoebis-store = { path = "../store" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
boring = { workspace = true }
fake-upstream = { path = "../../tests/fake_upstream" }
# An integration test builds the library without `cfg(test)`, so the counter it reads needs the feature on.
phoebis-keepalive = { path = ".", features = ["debug-hooks"] }
phoebis-profile = { path = "../profile" }
phoebis-transport = { path = "../transport" }
# The probe deadline is five minutes, so the test that waits it out moves tokio's clock instead of the wall's.
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
