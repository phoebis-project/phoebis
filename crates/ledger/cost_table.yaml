# The cost table: per window and model, the share of a Max 20x subscription's window that one million tokens of each
# type consume, as a fraction of the window (0.06647 is 6.647% of it; the console shows the percent). Max 20x is the
# reference tier, whose factors under `tiers` are 1; an account on another tier spends a share over its tier's factor
# for that window. A cell or a factor is a number the plan meter measured, or `null`, which means unmeasured: no reader
# prices a share through a `null`, so the prediction adds no charge for it, the shedding round ranks the pin after
# every priced one, the keepalive settles the probe in dollars, the analytics list the share as model unlisted and the
# cost reference shows a dash. `effective` is the table's only date. A dated model id reads the row of its undated name.
#
# Open measurements, each a table-only change when read:
# - whether the cross-tier factor holds inside the peak band (assumed yes: the band factor applies on every tier);
# - the 7-day factors of Max 5x and Pro (`null` until measured; the 7-day window does not scale as the 5-hour one);
# - whether the band reaches the 7-day window (the band row lists `five_hour` alone until measured).
#
# The Fable-scoped week is priced as half the 7-day window on every tier, so a request's share of it is twice its
# 7-day share. A band row's hours and weekdays are read in its time zone, so its UTC edges follow the zone's daylight
# rule; a window takes the last band row that names it.
effective: 2026-10-01
# Pro over Max 20x read as 20 and Max 5x over Max 20x taken as 4 until a measurement on that tier confirms it.
tiers:
  default_claude_max_20x: {five_hour: 1, seven_day: 1}
  default_claude_max_5x: {five_hour: 0.25, seven_day: null}
  default_claude_pro: {five_hour: 0.05, seven_day: null}
# The 5-hour cells are the plan meter's readings of 2026-09-30 on Max 20x; the older models are `null` throughout,
# since only the plan meter's values are trusted, and every 7-day cell waits for a measurement on that window.
windows:
  five_hour:
    claude-fable-5: {input: null, cache_read: null, cache_write_5m: null, cache_write_1h: null, output: null}
    claude-fable-5-1: {input: 0.06647, cache_read: 0.001675, cache_write_5m: 0.08326, cache_write_1h: 0.084, output: 0.3292}
    claude-haiku-4-5: {input: 0.00659, cache_read: 0.000167, cache_write_5m: 0.00824, cache_write_1h: 0.00823, output: 0.03294}
    claude-opus-5: {input: null, cache_read: null, cache_write_5m: null, cache_write_1h: null, output: null}
    claude-opus-5-5: {input: 0.01461, cache_read: 0.000365, cache_write_5m: 0.0183, cache_write_1h: 0.01824, output: 0.07279}
    claude-sonnet-5: {input: null, cache_read: null, cache_write_5m: null, cache_write_1h: null, output: null}
    claude-sonnet-5-5: {input: 0.00999, cache_read: 0.000249, cache_write_5m: 0.01247, cache_write_1h: 0.01251, output: 0.04984}
  seven_day:
    claude-fable-5: {input: null, cache_read: null, cache_write_5m: null, cache_write_1h: null, output: null}
    claude-fable-5-1: {input: null, cache_read: null, cache_write_5m: null, cache_write_1h: null, output: null}
    claude-haiku-4-5: {input: null, cache_read: null, cache_write_5m: null, cache_write_1h: null, output: null}
    claude-opus-5: {input: null, cache_read: null, cache_write_5m: null, cache_write_1h: null, output: null}
    claude-opus-5-5: {input: null, cache_read: null, cache_write_5m: null, cache_write_1h: null, output: null}
    claude-sonnet-5: {input: null, cache_read: null, cache_write_5m: null, cache_write_1h: null, output: null}
    claude-sonnet-5-5: {input: null, cache_read: null, cache_write_5m: null, cache_write_1h: null, output: null}
# Measured 2026-09-30 on Max 20x: in-band over out-of-band on the 5-hour meter, 1.435 plus or minus 0.01, the same for
# every token type and for both models measured; at peak the window holds 0.70 of its off-peak capacity. A charge is
# weighed by the band it lands in, at the request's completion. The edges are steps, sharp within twenty minutes; they
# move with the zone (13:00 to 19:00 UTC from 2026-11-01). The weekend is off.
bands:
  - zone: America/Los_Angeles
    weekdays: true
    from_hour: 5
    to_hour: 11
    factor: 1.435
    windows: [five_hour]
