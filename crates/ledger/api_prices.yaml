# The API list prices in dollars per million tokens. Each entry holds the whole table of its date and is in force from
# 00:00 UTC of that date to the next entry's date. A provider's price change, a new model or a moved threshold adds an
# entry. A correction of a figure this file had wrong edits every entry that carries the model, since the correction
# says what was always true.
revisions:
  - effective: 2026-10-01
    models:
      claude-fable-5-1: {input: 10, cache_write_5m: 12.5, cache_write_1h: 20, cache_read: 0.25, output: 50}
      claude-fable-5: {input: 10, cache_write_5m: 12.5, cache_write_1h: 20, cache_read: 1.0, output: 50}
      claude-opus-5-5:
        input: 4
        cache_write_5m: 5
        cache_write_1h: 8
        cache_read: 0.2
        output: 20
        fast: {input: 8, cache_write_5m: 10, cache_write_1h: 16, cache_read: 0.4, output: 40}
      claude-opus-5:
        input: 5
        cache_write_5m: 6.25
        cache_write_1h: 10
        cache_read: 0.5
        output: 25
        fast: {input: 10, cache_write_5m: 12.5, cache_write_1h: 20, cache_read: 1.0, output: 50}
      claude-opus-4-8:
        input: 5
        cache_write_5m: 6.25
        cache_write_1h: 10
        cache_read: 0.5
        output: 25
        fast: {input: 10, cache_write_5m: 12.5, cache_write_1h: 20, cache_read: 1.0, output: 50}
      claude-sonnet-5-5: {input: 2, cache_write_5m: 2.5, cache_write_1h: 4, cache_read: 0.2, output: 10}
      claude-sonnet-5: {input: 2, cache_write_5m: 2.5, cache_write_1h: 4, cache_read: 0.2, output: 10}
      claude-sonnet-4-6: {input: 3, cache_write_5m: 3.75, cache_write_1h: 6, cache_read: 0.3, output: 15}
      claude-sonnet-4-5: {input: 3, cache_write_5m: 3.75, cache_write_1h: 6, cache_read: 0.3, output: 15}
      claude-haiku-4-5: {input: 1, cache_write_5m: 1.25, cache_write_1h: 2, cache_read: 0.1, output: 5}
