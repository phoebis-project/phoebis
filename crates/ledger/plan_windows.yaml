# Window sizes per subscription tier, keyed by the tier the account's profile reports, as the cold-start prior of
# the live fit. The shared windows are meter tokens (one plain input token of the reference model on the 5-hour
# meter); the Fable-scoped week is Fable tokens, since the weekly meter may weigh Fable differently from the
# 5-hour one. The values are measured on 2026-09-18, 2026-09-19 and 2026-09-24.
#
# A band row's hours and weekdays are read in its time zone, so its UTC edges follow the zone's daylight rule. A
# row with `effective_from` takes over its windows from that date, and an earlier charge keeps the row in force at
# its own time, so a new row never re-weights history.
measured: 2026-09-24
tiers:
  default_claude_max_20x:
    # The Fable-scoped week is derived through the shared-window ratio rather than measured.
    five_hour: 47900000
    seven_day: 351100000
    seven_day_fable: 49000000
    measured: 2026-09-18
    unmeasured: true
  default_claude_max_5x:
    five_hour: 11890000
    seven_day: 164000000
    seven_day_fable: 23000000
    measured: 2026-09-19
  default_claude_pro:
    # No Fable-scoped window on this tier; the weekly cell was read over 0.81 of one window.
    five_hour: 2560000
    seven_day: 30000000
    measured: 2026-09-24
bands:
  # Provisional. A charge is weighed by the band it lands in, at the request's completion. Input read 1.33
  # (measured 2026-09-25) and output 1.44 (measured 2026-09-24), so the factor is 1.3 to 1.45 until one in-band
  # window reads both; 1.45 follows the output, which dominates a Claude Code request's meter cost. The edges are
  # steps, sharp within twenty minutes, measured at 12:00 and 18:00 UTC on 2026-09-25; they move with the zone
  # (13:00 to 19:00 UTC from 2026-11-01). The weekend is off: a Saturday probe inside the band hours read the
  # off-peak rate, measured 2026-09-26.
  - zone: America/Los_Angeles
    weekdays: true
    from_hour: 5
    to_hour: 11
    factor: 1.45
    windows: [five_hour]
    measured: 2026-09-24
    provisional: true
