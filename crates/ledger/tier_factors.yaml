# Each subscription tier's window capacity over Max 5x's, per window, keyed by the tier the account's profile
# reports: a share of a Max 5x window over the tier's factor is that share of the tier's own window. Max 5x is 1 by
# definition, since every cell of `cost_table.yaml` is priced on it. The Fable-scoped week is half the 7-day window on
# every tier and has no column.
#
# A factor carries `measured`, the day the tier's window was read against Max 5x's, or `unmeasured: true`, and every
# reader shows a flagged factor as unmeasured. Pro's 5-hour factor is its window size read on 2026-09-24 over Max 5x's
# read on 2026-09-19, 2 560 000 over 11 890 000; its 7-day factor is the reading of 2026-09-24 rounded to 0.18, where
# that day's window sizes give 0.183. Max 20x's rest on sizes read on 2026-09-18 and are flagged until a measurement
# on that tier confirms them.
measured: 2026-09-24
reference: default_claude_max_5x
tiers:
  default_claude_max_20x:
    five_hour: {factor: 4.03, unmeasured: true}
    seven_day: {factor: 2.14, unmeasured: true}
  default_claude_max_5x:
    five_hour: {factor: 1, measured: 2026-09-19}
    seven_day: {factor: 1, measured: 2026-09-19}
  default_claude_pro:
    five_hour: {factor: 0.215, measured: 2026-09-24}
    seven_day: {factor: 0.18, measured: 2026-09-24}
