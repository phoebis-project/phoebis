[package]
name = "phoebis-ledger"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# The read-failure test seam, see `LedgerDb::debug_fail_next_read`. This crate's own dev-dependency below turns it
# on for a test build, so a release build carries no way to fail a ledger read on purpose.
debug-hooks = []
# The analytics folds only the tests call (`apply_filter`, `breakdown`, `burn_rows`, `burn_series`, `series` and
# `LiveKeys::selects`), turned on by the dev-dependency below so a release build carries none of them.
test-support = []

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
phoebis-bus = { path = "../bus" }
phoebis-oauth = { path = "../oauth" }
phoebis-relay = { path = "../relay" }
phoebis-routing = { path = "../routing" }
phoebis-store = { path = "../store" }
phoebis-transport = { path = "../transport" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
fake-upstream = { path = "../../tests/fake_upstream" }
http-body-util = { workspace = true }
phoebis-cch = { path = "../cch" }
# An integration test builds the library without `cfg(test)`, so the seam it reaches needs the feature on.
phoebis-ledger = { path = ".", features = ["debug-hooks", "test-support"] }
phoebis-profile = { path = "../profile" }
# The test builders of the registry's rows, kept off the dependency above so a release build carries none.
phoebis-store = { path = "../store", features = ["test-support"] }
rand = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
