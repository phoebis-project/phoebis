[package]
name = "phoebis-ledger"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# The read-failure and read-hold test seams and the read count, see `LedgerDb::debug_fail_next_writer_read`,
# `debug_hold_next_writer_read` and `debug_page_reads`. This crate's own dev-dependency below and the admin crate's turn
# it on for a test build, so a release build carries no way to fail or hold a ledger read on purpose and no counter.
debug-hooks = ["phoebis-store/debug-hooks"]
# The analytics folds only the tests call (`apply_filter`, `breakdown`, `series` and `LiveKeys::selects`), the disk cap
# a held batch is built on (`LedgerDb::fill_the_disk` and `free_the_disk`), the landings at the shipped price list and
# at a list of the caller's (`LedgerDb::insert_request` and `LedgerDb::insert_request_at`) and the re-exports of the
# reconciliation's read and write (`reconcile_read` and `reconcile_write`), turned on by the dev-dependency below and
# the dev-dependencies of the crates whose tests reach them, so a release build carries none of them.
test-support = []

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
phoebis-bus = { path = "../bus" }
phoebis-oauth = { path = "../oauth" }
phoebis-relay = { path = "../relay" }
phoebis-routing = { path = "../routing" }
phoebis-store = { path = "../store" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
fake-upstream = { path = "../../tests/fake_upstream" }
http-body-util = { workspace = true }
phoebis-cch = { path = "../cch" }
# An integration test builds the library without `cfg(test)`, so the seam it reaches needs the feature on.
phoebis-ledger = { path = ".", features = ["debug-hooks", "test-support"] }
# The limit resets parser's re-export a rig writes its block with, kept off the dependency above as the store's are.
phoebis-oauth = { path = "../oauth", features = ["test-support"] }
# The tests read the embedded fixture files, which the feature gates.
phoebis-profile = { path = "../profile", features = ["test-support"] }
# The routing loop's test seams, `RouterHandle::emit` among them, kept off the dependency above as the store's are.
phoebis-routing = { path = "../routing", features = ["debug-hooks"] }
# The test builders of the registry's rows, kept off the dependency above so a release build carries none.
phoebis-store = { path = "../store", features = ["test-support"] }
phoebis-transport = { path = "../transport" }
rand = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# The feature call tests open the feature listener's TLS connections through it.
tokio-boring = { workspace = true }
tower = { workspace = true }
