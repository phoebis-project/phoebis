# The subscription cost model. A token costs weight(model) x multiplier(type) units on every window; a window holds
# `capacity` units; a request's share of a window is the units it spent over that capacity, over the peak factor when
# the request completes inside the band. Unit: 1/150,000,000 of the Max 20x 5-hour window outside the peak band, so
# one percent of that window, the step the usage header moves in, is 1,500,000 units. An account tier left out, or
# set to null, is unpriced. A model without a weight prices at the weight of its model tier's latest weighted model,
# as an estimate, and a model of no model tier, or of one with no weight, prices nothing. Written by the plan meter's
# table_fit.py. Every value is a design constant it tested, except a row whose comment says it is assumed.
revisions:
  - effective: 2026-10-05

    unit:
      defined_by: {tier: default_claude_max_20x, window: five_hour, band: out_of_band}
      units_per_window: 150000000

    capacity:  # units per window, keyed by the tier the profile reports; a Pro subscription reports default_claude_ai
      default_claude_ai:      {five_hour: 7500000, seven_day: 90000000}
      default_claude_max_5x:  {five_hour: 37500000, seven_day: 450000000}
      default_claude_max_20x: {five_hour: 150000000, seven_day: 900000000}

    peak:  # hours and weekdays read in `zone`; a request completing inside them meets this fraction of the capacity
      zone: America/Los_Angeles
      weekdays: true
      from_hour: 5
      to_hour: 11
      capacity_factor: {five_hour: 0.7, seven_day: 1}

    type_multiplier: {cache_read: 0.025, cache_write_1h: 1.25, cache_write_5m: 1.25, input: 1, output: 5}

    model_weight:  # units per plain input token, by undated id; a dated id reads its undated row
      claude-fable-5-1:   10    # 2026-09-30, Max 20x out of band, 6.647 +/- 0.012 percent per 1M input
      claude-opus-5-5:    2.2   # 2026-10-04, Max 20x out of band, 1.467 +/- 0.0027 percent per 1M input
      claude-sonnet-5-5:  1.5   # 2026-09-30, Max 20x out of band, 0.9998 +/- 0.0013 percent per 1M input
      claude-sonnet-5:    1.5   # assumed 2026-10-11: not measured, Sonnet 5.5's weight at the same list price
      claude-haiku-5-5:   0.1   # 2026-10-08, Max 20x out of band, 0.06654 +/- 0.00051 percent per 1M input
      claude-haiku-4-5:   1     # 2026-10-05, Max 20x out of band, 0.6658 +/- 0.001 percent per 1M input

    model_windows:  # a window only some models carry, sized against a shared one
      seven_day_fable: {of: seven_day, capacity_factor: 0.5}

    # For a model that breaks a shared constant. Nothing measured so far needs one; the hook exists so a deviation
    # is written next to the model rather than by bending the shared numbers. Example shape, not a row:
    #   overrides:
    #     claude-example-6: {type_multiplier: {cache_read: 0.1}, weight_by_window: {seven_day: 2.4}}
    overrides: {}

    tier_order: [fable, opus, sonnet, haiku]

    # The model tier of every model either file lists and of the catalog models no file prices yet, by undated id. A
    # model without a weight prices at the latest weighted model of its tier, which this map names before any file
    # prices the model, so a listed model's tier is never guessed from its id.
    model_tier:
      claude-fable-5-1: fable
      claude-fable-5: fable
      claude-opus-5-5: opus
      claude-opus-5: opus
      claude-opus-4-8: opus
      claude-opus-4-7: opus
      claude-opus-4-6: opus
      claude-opus-4-5: opus
      claude-sonnet-5-5: sonnet
      claude-sonnet-5: sonnet
      claude-sonnet-4-6: sonnet
      claude-sonnet-4-5: sonnet
      claude-haiku-5-5: haiku
      claude-haiku-4-5: haiku
