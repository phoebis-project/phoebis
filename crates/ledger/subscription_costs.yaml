# The subscription cost model. A token costs weight(model) x multiplier(type) units on every window, a window holds
# `capacity` units, and a request's share of a window is the units it spent over that capacity, over the peak factor
# when the request completes inside the band. Unit: 1/90,000,000 of the Pro 7-day window, so one percent of that
# window, the step the usage header moves in, is 900,000 units. A `regimes` entry prices the entrypoints it lists at
# its own capacity rows and band factor, every other entrypoint at the rows above. The unit stays the base Pro 7-day
# window, of which an interactive window holds 112,500,000. An account tier left out, or set to null, is unpriced. A
# model without a weight, or of no model tier, prices nothing.
unit: {tier: default_claude_ai, window: seven_day}
revisions:
  - effective: 2026-10-05

    capacity:  # units per window, keyed by the tier the profile reports, default_claude_ai for a Pro subscription
      default_claude_ai:      {five_hour: 7500000, seven_day: 90000000}
      default_claude_max_5x:  {five_hour: 37500000, seven_day: 450000000}
      default_claude_max_20x: {five_hour: 150000000, seven_day: 900000000}

    peak:  # hours and weekdays read in `zone`: a request completing inside them meets this fraction of the capacity
      zone: America/Los_Angeles
      weekdays: true
      from_hour: 5
      to_hour: 11
      capacity_factor: {five_hour: 0.7, seven_day: 1}

    type_multiplier: {cache_read: 0.025, cache_write_1h: 1.25, cache_write_5m: 1.25, input: 1, output: 5}

    model_weight:  # units per plain input token, by undated id, which a dated id reads too
      claude-fable-5-1:   10
      claude-fable-5:     10
      claude-opus-5-5:    2.2
      claude-opus-5:      2.75
      claude-opus-4-8:    3.25
      claude-sonnet-5-5:  1.5
      claude-sonnet-5:    1.5
      claude-sonnet-4-6:  3
      claude-haiku-5-5:   0.1
      claude-haiku-4-5:   1

    model_windows:  # a window only some models carry, sized against a shared one
      seven_day_fable: {of: seven_day, capacity_factor: 0.5}

    # For a model that breaks a shared constant. Nothing measured so far needs one. The hook exists so a deviation is
    # written next to the model rather than by bending the shared numbers. Example shape, not a row:
    #   overrides:
    #     claude-example-6: {type_multiplier: {cache_read: 0.1}, weight_by_window: {seven_day: 2.4}}
    overrides: {}

    tier_order: [fable, opus, sonnet, haiku]

    # The model tier of every model either file lists and of the catalog models no file prices yet, by undated id. The
    # tiers order the cost reference's rows and the routing log's model order, so a listed model's tier is never
    # guessed from its id.
    model_tier:
      claude-fable-5-1: fable
      claude-fable-5: fable
      claude-opus-5-5: opus
      claude-opus-5: opus
      claude-opus-4-8: opus
      claude-opus-4-7: opus
      claude-opus-4-6: opus
      claude-opus-4-5: opus
      claude-sonnet-5-5: sonnet
      claude-sonnet-5: sonnet
      claude-sonnet-4-6: sonnet
      claude-sonnet-4-5: sonnet
      claude-haiku-5-5: haiku
      claude-haiku-4-5: haiku

    regimes:  # named by what they price, and an entrypoint no regime lists reads the rows above
      interactive:
        entrypoints: [claude-desktop, claude-desktop-3p, claude-vscode, cli]
        capacity:
          default_claude_ai:      {five_hour: 15000000, seven_day: 112500000}
          default_claude_max_5x:  {five_hour: 75000000, seven_day: 562500000}
          default_claude_max_20x: {five_hour: 300000000, seven_day: 1125000000}
        peak:
          capacity_factor: {five_hour: 1, seven_day: 1}
