[package]
name = "phoebis-session-engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# The count of causes that `Engine::reasons` answers, the flush counters (`Engine::persist_entries`,
# `Engine::persist_reached` and `Engine::persist_snapshots`), `Engine::recipes_for`, the step scheduler's router-ask
# counter (`Engine::router_views`) and the timing seam that `KeepaliveTiming::for_start` reads its two variables
# through. A dependent's dev-dependency, and this crate's own below, turn it on for a test build, so a release build
# carries none of it.
debug-hooks = []

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
jiff = { workspace = true }
phoebis-bus = { path = "../bus" }
phoebis-cch = { path = "../cch" }
phoebis-ledger = { path = "../ledger" }
phoebis-oauth = { path = "../oauth" }
phoebis-relay = { path = "../relay" }
phoebis-routing = { path = "../routing" }
phoebis-store = { path = "../store" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
unicode-general-category = { workspace = true }

[dev-dependencies]
boring = { workspace = true }
fake-upstream = { path = "../../tests/fake_upstream" }
http-body-util = { workspace = true }
# The test tables, kept off the dependency above so a release build carries none.
phoebis-ledger = { path = "../ledger", features = ["test-support"] }
# The tests read the embedded fixture files, which the feature gates.
phoebis-profile = { path = "../profile", features = ["test-support"] }
# The router task's projection stamp, which the release case sets past the trigger's wait so a request runs a round.
phoebis-routing = { path = "../routing", features = ["debug-hooks"] }
# An integration test builds the library without `cfg(test)`, so the counter it reads needs the feature on.
phoebis-session-engine = { path = ".", features = ["debug-hooks"] }
# The test builders of the registry's rows, kept off the dependency above so a release build carries none.
phoebis-store = { path = "../store", features = ["test-support"] }
phoebis-transport = { path = "../transport" }
# The restart tests reach the rig's registry file past the store: they damage a sealed prompt, hold the file's write
# lock while a save waits and make a save fail, as an operator's `sqlite3` or a failing disk would.
rusqlite = { workspace = true }
# The rig's ledger file lives under a temporary directory.
tempfile = { workspace = true }
# The probe deadline is five minutes, so the test that waits it out moves tokio's clock instead of the wall's.
tokio = { workspace = true, features = ["test-util"] }
# The relay's harness, which the tests include, opens the feature listener's TLS connections through it.
tokio-boring = { workspace = true }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
