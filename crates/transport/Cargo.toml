[package]
name = "phoebis-transport"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
boring = { workspace = true }
brotli = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
httparse = { workspace = true }
# Profile is part of connector_builder's public signature, so this must be a regular
# dependency; a dev-dependency is invisible to the lib target that declares it.
phoebis-profile = { path = "../profile" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-boring = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
fake-upstream = { path = "../../tests/fake_upstream" }
# The embedded fixture files, which only tests read, kept off the dependency above so a release build compiles none.
phoebis-profile = { path = "../profile", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
