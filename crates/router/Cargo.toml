phoebis-relay = { path = "../relay" }
phoebis-store = { path = "../store" }
phoebis-transport = { path = "../transport" }
clap = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
