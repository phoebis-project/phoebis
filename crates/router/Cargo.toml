[package]
name = "phoebis-router"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "phoebis_router"
path = "src/lib.rs"

[[bin]]
name = "phoebis"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
jiff = { workspace = true }
phoebis-admin = { path = "../admin" }
phoebis-attention = { path = "../attention" }
phoebis-bus = { path = "../bus" }
phoebis-cch = { path = "../cch" }
phoebis-keepalive = { path = "../keepalive" }
phoebis-ledger = { path = "../ledger" }
phoebis-live = { path = "../live" }
phoebis-oauth = { path = "../oauth" }
phoebis-profile = { path = "../profile" }
phoebis-relay = { path = "../relay" }
phoebis-routing = { path = "../routing" }
phoebis-store = { path = "../store" }
phoebis-transport = { path = "../transport" }
phoebis-ui = { path = "../ui" }
serde = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
fake-upstream = { path = "../../tests/fake_upstream" }
phoebis-store = { path = "../store", features = ["debug-hooks", "test-support"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
