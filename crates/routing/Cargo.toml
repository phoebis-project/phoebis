[package]
name = "phoebis-routing"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# The task's report hold, see `RouterHandle::hold_reports`. A dependent's dev-dependency, and this crate's own
# below, turn it on for a test build, so a release build carries no way to stall reports.
debug-hooks = []
# The exports of `decide`, `Decided` and `warmth_of`, which the crate itself reads in production and a suite reads
# for a case.
test-support = []

[dependencies]
jiff = { workspace = true }
phoebis-guardrails = { path = "../guardrails" }
phoebis-oauth = { path = "../oauth" }
phoebis-store = { path = "../store" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
fake-upstream = { path = "../../tests/fake_upstream" }
# The oauth crate's gated re-exports of the usage parse, which a case builds its poll with.
phoebis-oauth = { path = "../oauth", features = ["test-support"] }
phoebis-profile = { path = "../profile" }
# An integration test builds the library without `cfg(test)`, so the report hold it reaches needs `debug-hooks` and
# the exports of the selection that it reads need `test-support`.
phoebis-routing = { path = ".", features = ["debug-hooks", "test-support"] }
phoebis-store = { path = "../store", features = ["debug-hooks", "test-support"] }
phoebis-transport = { path = "../transport" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
