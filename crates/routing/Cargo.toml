[package]
name = "phoebis-routing"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# The task's report hold, see `RouterHandle::hold_reports`. A dependent's dev-dependency, and this crate's own
# below, turn it on for a test build, so a release build carries no way to stall reports.
debug-hooks = []

[dependencies]
jiff = { workspace = true }
phoebis-oauth = { path = "../oauth" }
phoebis-store = { path = "../store" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
fake-upstream = { path = "../../tests/fake_upstream" }
phoebis-profile = { path = "../profile" }
# An integration test builds the library without `cfg(test)`, so the hold it reaches needs the feature on.
phoebis-routing = { path = ".", features = ["debug-hooks"] }
phoebis-store = { path = "../store", features = ["debug-hooks"] }
phoebis-transport = { path = "../transport" }
