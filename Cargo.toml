[workspace]
members = [
    "crates/admin",
    "crates/cch",
    "crates/oauth",
    "crates/profile",
    "crates/relay",
    "crates/router",
    "crates/store",
    "crates/transport",
    "tests/fake_upstream",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1"
axum = "0.8.9"
base64 = "0.22"
boring = "5.2.0"
brotli = "9.0.0"
bytes = "1"
fd-lock = "4.0.4"
flate2 = "1.1.10"
futures = "0.3"
httparse = "1.10.1"
jiff = "0.2.37"
rand = "0.10.2"
rcgen = "0.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-boring = "5.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }
zeroize = { version = "1.9.0", features = ["derive"] }
zstd = "0.14.0"
