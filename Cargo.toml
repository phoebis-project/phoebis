[workspace]
members = [
    "crates/admin",
    "crates/attention",
    "crates/bus",
    "crates/cch",
    "crates/guardrails",
    "crates/keepalive",
    "crates/ledger",
    "crates/oauth",
    "crates/profile",
    "crates/relay",
    "crates/router",
    "crates/routing",
    "crates/store",
    "crates/transport",
    "crates/ui",
    "tests/fake_upstream",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1"
axum = "0.8.9"
base64 = "0.22"
boring = "5.2.0"
brotli = "9.0.0"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fd-lock = "4.0.4"
flate2 = "1.1.10"
futures = "0.3"
hmac = "0.12"
http-body-util = "0.1"
httparse = "1.10.1"
hyper = { version = "1.11.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["server", "server-graceful", "service", "tokio"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.37", features = ["tzdb-bundle-always"] }
# Without the default features, so the test binary carries no resolver that fetches a remote reference.
jsonschema = { version = "0.59.0", default-features = false }
libc = "0.2.189"
mime_guess = "2.0.5"
rand = "0.10.2"
rcgen = "0.13"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
# Embedded in debug builds too, so both profiles serve the same bytes and no binary reads the tree it was built from.
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_norway = "0.9.42"
sha2 = "0.10"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-boring = "5.2.0"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
utoipa = { version = "6.0.0", features = ["axum_extras", "preserve_order", "preserve_path_order"] }
utoipa-axum = "0.3.0"
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }
zeroize = { version = "1.9.0", features = ["derive"] }
zstd = "0.14.0"
