[project]
site_name = "Phoebis Router"
site_url = "https://daystrom-labs.github.io/phoebis/"
site_description = "A router for Claude Code. Every request lands on the right account."
repo_url = "https://github.com/daystrom-labs/phoebis"
repo_name = "daystrom-labs/phoebis"
# No edit_uri: the repository is private, so an edit link would land a reader on a login page.
docs_dir = "docs/site"
site_dir = "site"
extra_css = ["assets/logo.css"]

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = [
    { "Quick start" = "quickstart.md" },
    { "The client" = "client.md" },
    { "A second machine" = "second-machine.md" },
  ] },
  { "Reference" = [
    { "Installation" = "installation.md" },
    { "Pairing an account" = "pairing.md" },
    { "Pools, keys and routing" = "routing.md" },
    { "Guardrails" = "guardrails.md" },
    { "Keepalive" = "keepalive.md" },
    { "The keepalive mod" = "keepalive-mod.md" },
    { "The relay" = "relay.md" },
    { "The console" = "console.md" },
    { "Statistics" = "statistics.md" },
    { "API reference" = "api-reference.md" },
  ] },
  { "Operations" = "operations.md" },
  { "Development" = "development.md" },
  { "Changelog" = "changelog.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
custom_dir = "docs/overrides"
favicon = "assets/favicon.svg"
logo = "assets/phoebis-router-light.svg"
features = [
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Three palettes so the theme toggle offers system, light, and dark; the light and dark screenshot variants on
# the pages switch on the scheme these set.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
