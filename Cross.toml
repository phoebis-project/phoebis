# The console's bundle is built on the runner before cross runs; the build script embeds it as it is.
[build.env]
passthrough = ["BORING_BSSL_RUST_CPPLIB", "PHOEBIS_SKIP_UI_BUILD"]

# BoringSSL builds from source with cmake and a C++ compiler, and its bindings need libclang; the image carries the
# musl C and C++ toolchain, the three packages are added once per image.
[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:0.2.5"
pre-build = ["apt-get update && apt-get install -y --no-install-recommends clang cmake libclang-dev"]

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:0.2.5"
pre-build = ["apt-get update && apt-get install -y --no-install-recommends clang cmake libclang-dev"]
